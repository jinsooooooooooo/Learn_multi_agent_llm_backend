# /rag_multi_agent_project/manifests/00-namespace.yaml

# apiVersion: 이 오브젝트를 생성하기 위해 사용할 쿠버네티스 API 버전을 명시합니다.
# Namespace는 가장 기본적인 기능이므로 v1에 속합니다.
apiVersion: v1
kind: Namespace # kind: 생성하려는 리소스의 종류를 나타냅니다. 우리는 '네임스페이스'를 만들 것입니다.

# metadata: 이름, 레이블 등 이 리소스를 식별할 수 있는 메타데이터를 포함합니다.
metadata:
  name: llm-app-backend
  # name: 이 네임스페이스의 고유한 이름입니다.
  # 보통 서비스 성격에 맞게 정합니다.