# /rag_multi_agent_project/manifests/01-deployment.yaml

apiVersion: apps/v1 # 'piVersion' -> 'apiVersion' 오타 수정!
kind: Deployment
metadata:
  name: backend-deployment
  namespace: llm-app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pod가 비공개 레지스트리에서 이미지를 가져올 때 사용할 '출입증(Secret)'을 지정합니다.
      imagePullSecrets:
        # 'name:' 에는 위 6-1 단계에서 지정한 "사용자 정의 이름"('harbor-secret')을 정확하게 적어줍니다.
        - name: harbor-secret

      containers:
        - name: backend-container
          # 이제 이 이미지를 다운로드할 때, 쿠버네티스는 'harbor-secret'을 사용하여 Harbor에 로그인합니다.
          image: 49.50.132.167/llm-project/backend:latest
          ports:
            - containerPort: 8000
          
          # --- 수정된 부분 1: env 에서는 비-민감 정보만 남깁니다. ---
          env:
            - name: APP_ENV
              value: "prd"
            - name: APP_NAME
              value: "[prd] LLM App Backend"
            - name: DEFAULT_LLM_MODEL
              value: "gpt-4o-mini"
            - name: GEMINI_DEFAULT_MODEL
              value: "gemini-1.5-flash-latest"
            
            # NCP Object Storage (비-민감 정보)
            - name: NCP_REGION
              value: "kr-standard"
            - name: NCP_OBJECT_STORAGE_ENDPOINT
              value: "https://kr.object.ncloudstorage.com"
            - name: NCP_BUCKET_NAME
              value: "rag-project-bucket-jinsoo"
              
            # Redis (localhost -> 서비스 이름으로 변경!)
            - name: REDIS_HOST
              value: "redis-service" 
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"

          # --- 수정된 부분 2: envFrom 을 추가하여 Secret을 참조합니다. ---
          envFrom:
            - secretRef:
                # 방금 만든 Secret 파일의 metadata.name과 일치해야 합니다.
                name: backend-secrets