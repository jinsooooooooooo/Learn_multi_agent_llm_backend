# 담당 부서: networking.k8s.io/v1 ('네트워킹과')
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: llm-app-backend
  # annotations: Ingress Controller의 세부 동작을 설정하는 '특별 지시사항'입니다.
  annotations:
    # kubernetes.io/ingress.class: "nginx"
    #   -> "이 Ingress 규칙은 'nginx' Ingress Controller가 담당해주세요." 라는 의미입니다.
    #      NKE의 기본 컨트롤러가 nginx이므로 명시해주는 것이 좋습니다.
    kubernetes.io/ingress.class: "nginx"
    # NGINX Ingress Controller에게 경로 재작성 규칙을 명시적으로 알려줍니다.
    # "$2"는 path에 있는 정규식의 두 번째 캡처 그룹을 의미합니다.
    # 즉, "/api(/|$)(.*)" 경로로 들어온 요청을 "/api/$2"로 전달하라는 의미입니다.
    # 예: /api/health -> /api/health (그대로 유지)
    # nginx.ingress.kubernetes.io/rewrite-target: /api/$2
spec:
  # rules: 이곳에 라우팅 규칙들을 정의합니다.
  rules:
    # http: HTTP 트래픽에 대한 규칙입니다.
    - host: "jinsoo-llm.com"
      http:
        # paths: 경로 목록입니다.
        paths:
          # - path: 외부에서 접근할 경로입니다.
          - path: /api
            # pathType: 경로를 어떤 방식으로 매칭할지 정합니다.
            # Prefix: '/api'로 시작하는 모든 경로 (e.g., /api, /api/, /api/chat)와 매칭됩니다.
            pathType: Prefix
            # backend: 이 경로로 들어온 요청을 어디로 보낼지 정의합니다.
            backend:
              # service: 전달할 대상 Service의 정보입니다.
              service:
                # name: 우리가 만든 Service의 이름입니다.
                name: backend-service
                # port: 해당 Service가 노출하고 있는 포트입니다.
                port:
                  number: 80