name: CI for Backend - Build and Push Docker Image to Harbor
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 실행될 작업(job)들을 정의합니다. 여기서는 'build-and-push'라는 작업 하나만 있습니다.
jobs:
  build-and-push:
    # 이 작업이 실행될 가상 머신의 종류를 지정합니다. (Ubuntu 최신 버전)
    runs-on: ubuntu-latest

    # 작업 내에서 실행될 단계(step)들을 순서대로 정의합니다.
    steps:
      # 1단계: 코드 체크아웃
      #   - GitHub 저장소의 코드를 가상 머신으로 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # [수정된 부분] Harbor 로그인 전에 이 단계를 추가합니다!
      #----------------------------------------------------------------------
      - name: Configure Docker for Insecure Registry
        run: |
          # Docker 데몬 설정 파일이 들어갈 디렉토리를 생성합니다.
          sudo mkdir -p /etc/docker
          # insecure-registries 설정을 담은 daemon.json 파일을 생성합니다.
          # 이 설정은 Docker에게 '49.50.132.167' 주소는 HTTP로 통신해도 안전하다고 알려줍니다.
          echo '{"insecure-registries":["49.50.132.167"}' | sudo tee /etc/docker/daemon.json
          # 변경된 설정을 적용하기 위해 Docker 데몬을 재시작합니다.
          sudo service docker restart
      #----------------------------------------------------------------------


      # 2단계: Docker Buildx 설정
      #   - 더 빠르고 다양한 형식의 이미지를 빌드할 수 있는 Docker의 고급 빌드 엔진을 설정합니다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3단계: Harbor에 로그인
      #   - Docker 이미지를 푸시하기 위해 Harbor 레지스트리에 로그인합니다.
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          # registry: Harbor 주소입니다. (http:// 부분은 제외합니다)
          registry: 49.50.132.167
          # username: Harbor 로그인 아이디입니다.
          username: admin
          # password: Harbor 로그인 비밀번호입니다.
          # [경고!] 지금은 학습을 위해 비밀번호를 직접 입력했지만,
          # 실제 프로덕션에서는 반드시 GitHub Secrets (${{ secrets.HARBOR_PASSWORD }})를 사용해야 합니다.
          password: Harbor12345

      # 4단계: Docker 이미지 빌드 및 Harbor에 푸시
      #   - Dockerfile을 사용하여 이미지를 빌드하고, 로그인된 Harbor 레지스트리로 푸시합니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # context: Docker 빌드를 실행할 위치 (Dockerfile이 있는 위치)
          context: .
          # file: 사용할 Dockerfile의 경로
          file: ./Dockerfile
          # push: 빌드 후 이미지를 레지스트리로 푸시할지 여부 (true)
          push: true
          # tags: 이미지에 부여할 태그. deployment.yaml에 명시된 경로와 정확히 일치해야 합니다.
          tags: 49.50.132.167/llm-project/backend:latest
