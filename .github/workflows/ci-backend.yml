name: CI for Backend - Build and Push Docker Image to Harbor
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 실행될 작업(job)들을 정의합니다. 여기서는 'build-and-push'라는 작업 하나만 있습니다.
jobs:
  build-and-push:
    # 이 작업이 실행될 가상 머신의 종류를 지정합니다. (Ubuntu 최신 버전)
    runs-on: ubuntu-latest

    # 작업 내에서 실행될 단계(step)들을 순서대로 정의합니다.
    steps:
      # 1단계: 코드 체크아웃
      #   - GitHub 저장소의 코드를 가상 머신으로 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # [수정된 부분] Harbor 로그인 전에 이 단계를 추가합니다!
      # 2단계: 시스템 Docker 설정 (login-action을 위해 검증된 방식)
      - name: Configure Docker Daemon
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["49.50.132.167"]}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
          echo "--- Docker Daemon Config ---"
          sudo cat /etc/docker/daemon.json
          echo "--------------------------"

      # 3단계: Harbor에 로그인
      #   - Docker 이미지를 푸시하기 위해 Harbor 레지스트리에 로그인합니다.
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          # registry: Harbor 주소입니다. (http:// 부분은 제외합니다)
          registry: 49.50.132.167
          # username: Harbor 로그인 아이디입니다.
          username: admin
          # password: Harbor 로그인 비밀번호입니다.
          # [경고!] 지금은 학습을 위해 비밀번호를 직접 입력했지만,
          # 실제 프로덕션에서는 반드시 GitHub Secrets (${{ secrets.HARBOR_PASSWORD }})를 사용해야 합니다.
          password: Harbor12345

      # --- 해결책의 핵심: 복잡한 Action을 버리고 기본 명령어로 전환 ---
      # 4단계: Dockerfile을 사용하여 이미지 빌드 (기본 docker build 사용)
      #- name: Build image with basic docker command
      #  run: |
      #    docker build -t 49.50.132.167/llm-project/backend:latest .
      
      # 5단계: 빌드된 이미지를 Harbor에 푸시 (기본 docker push 사용)
      #- name: Push image with basic docker command
      #  run: |
      #    docker push 49.50.132.167/llm-project/backend:latest

      # --- 개선된 방법: Docker Buildx Action 사용 ---
      # 4단계: Buildx 설정 (호스트 도커 드라이버 사용
      - name: Set up buildx (use host docker driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # 5단계: Buildx를 사용하여 이미지 빌드 및 푸시
      - name: Build and push with buildx (uses host daemon -> respects insecure-registries)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: 49.50.132.167/llm-project/backend:latest