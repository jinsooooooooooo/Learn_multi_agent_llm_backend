apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-multi-agent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-multi-agent-backend
  template:
    metadata:
      labels:
        app: llm-multi-agent-backend
    spec:
      containers:
        - name: llm-multi-agent-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 360
