apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  APP_NAME: {{ .Values.env.APP_NAME | quote }}
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  OPENAI_API_KEY: {{ .Values.env.OPENAI_API_KEY | quote }}
  DEFAULT_LLM_MODEL: {{ .Values.env.DEFAULT_LLM_MODEL | quote }}
  GEMINI_API_KEY: {{ .Values.env.GEMINI_API_KEY | quote }}
  GEMINI_DEFAULT_MODEL: {{ .Values.env.GEMINI_DEFAULT_MODEL | quote }}
  REDIS_HOST: {{ .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
  REDIS_DB: {{ .Values.env.REDIS_DB | quote }}
  NAVER_CLIENT_ID: {{ .Values.env.NAVER_CLIENT_ID | quote }}
  NAVER_CLIENT_SECRET: {{ .Values.env.NAVER_CLIENT_SECRET | quote }}
  NCP_ACCESS_KEY: {{ .Values.env.NCP_ACCESS_KEY | quote }}
  NCP_SECRET_KEY: {{ .Values.env.NCP_SECRET_KEY | quote }}
  NCP_REGION: {{ .Values.env.NCP_REGION | quote }}
  NCP_OBJECT_STORAGE_ENDPOINT: {{ .Values.env.NCP_OBJECT_STORAGE_ENDPOINT | quote }}
  NCP_BUCKET_NAME: {{ .Values.env.NCP_BUCKET_NAME | quote }}
