[tool.ruff]
line-length = 150
ignore = ["D100"] # D100 규칙 무시: 모듈에 docstring이 업성도 경고하지 않음
select = [
	"E", # pycodestype - 코드스타일 규칙 (들여쓰기, 공백 등)
	"F", # pyflakes - 논리적오류 검출 (미사용 import, 정의되지 않은 변수 등)
	# "D", # pydocsytle - doctstring 스타일 검사
	"I", # isort - import 문 정렬 및 구성
	"B", # bugbear - 잠재적 버그 및 설계 문제 탐지
	"N", # pep8-naming - 변수/함수/클래스 명명 규칙 검사
	"S", # security - 보안취약점 검사 (SQL injection, eval 사용 등)
]

# flage8-bugbear 플러그인 설정
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
	"fastapi.Dpendens","fastapi.params.Dependes",
	# "fastapi.Query","fastapi.params.Dependes",
	# "fastapi.Body","fastapi.params.Body",
	# "fastapi.Header","fastapi.params.Header",
	# "fastapi.Path","fastapi.params.Path",
	# "fastapi.Cookie","fastapi.params.Cookie",
	# "fastapi.File","fastapi.params.File",
	# "fastapi.Form","fastapi.params.Form",
	# "fastapi.Security","fastapi.params.Security",	
]

# 설명:
# FastAPIdml Depends 같은 함수 호출을 불변(imutable)으로 취급
# B008 경고 방지: 함수 호출을 기본 인자로 사용 할 때 발생하는 경고 무시 
# FastAPI에서 Dpends()를 배개변수 기본값으로 사용하는 것이 일반적이므로 허용 

[tool.commitizen]
name = "cz_customize"
version = "2.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:tool.commitizen.version"
]
update_changelog_on_bump = true
bump_message = "build: bump version to $current_version → $new_version"

[tool.commitizen.customize]
message_template = "{{type}}({{scope}}): {{subject}}"
commit_parser = "^(?P<type>feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)(?:\\((?P<scope>[^\\)]+)\\))?:\\s(?P<subject>.+)$"
change_type_map = { "feat" = "Features", "fix" = "Bug Fixes", "refactor" = "Code Refactoring", "perf" = "Performance Improvements", "test" = "Tests", "docs" = "Documentation", "style" = "Styling", "build" = "Build System", "ci" = "CI/CD", "chore" = "Chores", "revert" = "Reverts" }

questions = [
    { name = "type", type = "list", message = "Select the type of change you are committing", choices = [
        { value = "feat", name = "[feat] 새로운 기능 추가" },
        { value = "fix", name = "[fix] 버그 수정" },
        { value = "refactor", name = "[refactor] 리팩토링" },
        { value = "perf", name = "[perf] 성능 개선" },
        { value = "test", name = "[test] 테스트 수정" },
        { value = "docs", name = "[docs] 문서 변경" },
        { value = "style", name = "[style] 코드 스타일 변경" },
        { value = "build", name = "[build] 빌드/의존성 변경 (requirements.txt)" },
        { value = "ci", name = "[ci] CI/CD 변경" },
        { value = "chore", name = "[chore] 기타 변경 (예: .gitignore)" },
        { value = "revert", name = "[revert] 이전 커밋으로 되돌리기" }
    ]},
    { name = "scope", type = "input", message = "이 변경의 범위는 무엇입니까? (class or file name)" },
    { name = "subject", type = "input", message = "코드 변경 사항에 대한 명령형 요약을 작성하세요" },
    { name = "body", type = "input", message = "추가적인 맥락 정보를 제공하세요 (optional, '|' for newlines)" },
    { name = "is_breaking", type = "confirm", message = "이것은 호환성을 깨뜨리는 변경 입니까? (BREAKING CHANGE)", default = false },
    { name = "footer", type = "input", message = "Footer (e.g. issues, references)" }
]